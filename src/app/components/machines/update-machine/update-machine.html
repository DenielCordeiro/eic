<div class="container">
    <mat-card class="form-card">
        <mat-card-header>
            <mat-card-title>
                <mat-icon>edit</mat-icon>
                Atualizar Máquina
            </mat-card-title>

            <a mat-icon-button (click)="cancel()" title="Fechar">
                <mat-icon>close</mat-icon>
            </a>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="machineForm" (ngSubmit)="onSubmit()" class="machine-form">

                <div class="form-grid">
                    <!-- Dados do Usuário -->
                    <mat-form-field appearance="outline">
                        <mat-label>Usuário</mat-label>
                        <input matInput formControlName="Usuario" placeholder="Ex: João Silva">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>E-mail</mat-label>
                        <input matInput formControlName="Email" type="email" placeholder="joao@empresa.com">
                    </mat-form-field>

                    <!-- Dados da Máquina -->
                    <mat-form-field appearance="outline">
                        <mat-label>Nome da Máquina</mat-label>
                        <input matInput formControlName="Nome_da_Maquina" placeholder="Ex: NTSIM006">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Sistema Operacional</mat-label>
                        <input matInput formControlName="Sistema_Operacional" placeholder="Ex: Windows 11 Pro">
                    </mat-form-field>

                    <!-- Hardware -->
                    <mat-form-field appearance="outline">
                        <mat-label>Placa-Mãe</mat-label>
                        <input matInput formControlName="Placa_mae" placeholder="Ex: ASUS B550M">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Processador</mat-label>
                        <input matInput formControlName="Processador" placeholder="Ex: Intel i7-12700K">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Armazenamento</mat-label>
                        <input matInput formControlName="Armazenamento" placeholder="Ex: SSD 512GB NVMe">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Placa de Vídeo</mat-label>
                        <input matInput formControlName="Placa_de_Video" placeholder="Ex: RTX 3060 12GB">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Conector de Rede</mat-label>
                        <input matInput formControlName="Conector_de_Rede" placeholder="Ex: Wi-Fi + Gigabit Ethernet">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Quantidade de RAM</mat-label>
                        <input matInput formControlName="Quantidade_de_RAM" placeholder="Ex: 16GB">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Geração da RAM</mat-label>
                        <input matInput formControlName="Geracao_da_RAM" placeholder="Ex: DDR4">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Termo / Status</mat-label>
                        <input matInput formControlName="Termo" placeholder="Ex: Assinado / Pendente">
                    </mat-form-field>
                </div>

                <div class="form-actions">
                    <button mat-raised-button color="primary" type="submit" [disabled]="machineForm.invalid">
                        <mat-icon>save</mat-icon>
                        Salvar Máquina
                    </button>
                </div>

            </form>
        </mat-card-content>
    </mat-card>
</div>
